name: Postar desafio diário no Telegram

on:
  schedule:
    # Roda todo dia às 09:00 (horário de Brasília / UTC-3 = 12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite rodar manualmente na aba Actions

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar bot diário
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python .github/scripts/bot_diario.py
